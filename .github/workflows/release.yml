name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve Version Information
        id: version_step
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "TAG_NAME=${TAG}" >> $GITHUB_ENV
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Publish Self-Contained Single-File App
        run: |
          dotnet publish src/OhMyGittForWin/OhMyGittForWin.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/singlefile

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress

      - name: Compile Windows Installer
        run: |
          iscc /DMyAppVersion=${{ env.APP_VERSION }} installer/setup.iss

      - name: Prepare Release Artifacts
        shell: pwsh
        run: |
          Copy-Item publish/singlefile/OhMyGittForWin.exe publish/singlefile/OhMyGit-Portable-${{ env.TAG_NAME }}-win-x64.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: OhMyGit ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            publish/installer/OhMyGit-Setup-v*.exe
            publish/singlefile/OhMyGit-Portable-*-win-x64.exe
